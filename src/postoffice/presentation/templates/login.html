{% extends "base.html" %}
{% block titulo %}Entrar — Correios Digital{% endblock %}

{% block conteudo %}
<h1>Entrar</h1>
<p class="subtitulo">A senha abre sua chave privada. Ela não sai desta máquina.</p>

<div class="cartao">
    <form method="post">
        <label for="login">Login</label>
        <input id="login" name="login" autocomplete="username" autofocus required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>
    <p class="nota">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a>.</p>
</div>
{% endblock %}
